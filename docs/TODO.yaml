# deepseek-channel-octo 开发任务清单（TODO.yaml）

# 结构化任务清单——按路线图分阶段展开；每步含：涉及模块 / 验收标准 / 状态。
# 状态图例：done 已完成 · in_progress 进行中 · todo 未开始
# PRD 驱动：每个阶段开工前先写 PRD（docs/prd/PRD-<阶段>-<名称>.md），流程见 docs/PROCESS.md。
# 消费方：.githooks/check_commit_msg.py 校验 feat/fix 的 scope 阶段标识真实存在。

meta:
  status_legend:
    done: 已完成
    in_progress: 进行中
    todo: 未开始

stages:
  # ---- 阶段 A：dsh 接入 MVP ----
  - id: A
    name: dsh 接入 MVP
    steps:
      - id: A1
        title: GitHub 开源仓库 + 项目脚手架
        status: in_progress
        prd: docs/prd/PRD-A1-repo-scaffold.md
        prd_status: approved
        modules:
          - GitHub 公开仓库 deepseek-channel-octo（在用户账号下）
          - package.json / tsconfig.json / vitest / tsup / ESLint
          - LICENSE（Apache-2.0）/ README / .gitignore（已有）
        acceptance: "仓库公开可克隆；pnpm typecheck + lint + test 全绿；LICENSE 与 README 完整"
      - id: A2
        title: Hello World 插件（在 dsh 上安装运行）
        status: todo
        prd: docs/prd/PRD-A2-hello-world.md
        prd_status: approved
        modules:
          - src/index.ts（Cordis 插件：name + apply + inject，中文注释）
          - src/index.test.ts（vitest 单测）
          - dsh.bundle 声明 + cordis.patch.yml
        acceptance: "插件在本地 dsh 加载打印 hello；dsh --profile 启动可见插件加载日志；pnpm test 全绿"

  # ---- 阶段 B：消息收发最简 MVP ----
  - id: B
    name: 消息收发最简 MVP
    steps:
      - id: B1
        title: CLI 向 dsh 发送消息并接收回答
        status: todo
        prd: docs/prd/PRD-B1-cli-messaging.md
        modules:
          - bin/dsh-octo-bot.mjs（CLI：send 子命令）
          - src/agent/（官方 @deepseek-ai/dsh-sdk-client 集成，中文注释）
        acceptance: "CLI 发送 prompt 后返回 dsh 正常回答（含流式输出与退出码）"
      - id: B2
        title: HTTP 接口发送消息并接收回答（可选）
        status: todo
        prd: docs/prd/PRD-B2-http-messaging.md
        modules:
          - src/http/server.ts（/chat 端点，JSON 请求响应）
        acceptance: "curl POST /chat 返回 dsh 回答"

  # ---- 阶段 C：Octo 通道集成（后续规划，暂不展开 PRD）----
  - id: C
    name: Octo 通道集成
    steps:
      - id: C1
        title: AgentAdapter 抽象 + SDK runtime 桥接
        status: todo
        modules:
          - src/adapters/（AgentAdapter / AgentRun / AgentEvent 契约）
          - src/adapters/dsh/（sdk-runtime / sdk-adapter / sdk-translate）
        acceptance: 待立项细化（对齐 docs/dsh-lark-bot-analysis.md）
      - id: C2
        title: Octo WebSocket 通道
        status: todo
        modules:
          - src/bridge/octo-channel.ts（WS 接入、消息模型、bot 注册）
        acceptance: 待立项细化
      - id: C3
        title: 会话路由与并发
        status: todo
        modules:
          - src/session/、src/bot/（scope key、排队、中断、审批）
        acceptance: 待立项细化
      - id: C4
        title: 测试 CI 文档与发布
        status: todo
        modules:
          - CI 矩阵、兼容探测、npm 发布
        acceptance: 待立项细化
